name: Trigger CodeRabbit once

# Disposable helper for this PR. workflow_dispatch only — remove after merge.

on:
  workflow_dispatch:

concurrency:
  group: trigger-coderabbit-pr-81
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Comment @coderabbitai review on PR 81
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cursor-agent-coderabbit-trigger -->'
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 81,
              per_page: 100,
            })
            const alreadyTriggered = comments.some(
              (c) =>
                c.user?.login === 'github-actions[bot]' &&
                typeof c.body === 'string' &&
                c.body.includes(marker)
            )
            const body = alreadyTriggered
              ? '<!-- cursor-agent-coderabbit-retrigger -->\n@coderabbitai review'
              : `${marker}\n@coderabbitai review`
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 81,
              body,
            })
            core.info(alreadyTriggered ? 'Posted follow-up review request' : 'Posted initial review request')
