name: Trigger CodeRabbit once

# Temporary: agent cannot post PR comments with the cloud token (403).
# This workflow uses GITHUB_TOKEN (issues:write) to request a CodeRabbit review.
# Remove after PR #81 is merged.

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/pgm-route-hardcut-looks-8972

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Comment @coderabbitai review on PR 81
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cursor-agent-coderabbit-trigger -->'
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 81,
              per_page: 100,
            })
            if (comments.some((c) => c.body && c.body.includes(marker))) {
              core.info('Trigger comment already present; skipping')
              return
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 81,
              body: `${marker}\n@coderabbitai review`,
            })
            core.info('Posted CodeRabbit review request')
